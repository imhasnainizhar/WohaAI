services:
  # ===========================
  # Users Postgres DB
  # ===========================
  users-postgres-db:
    image: postgres:16
    container_name: ${USERS_POSTGRES_DB_NAME}
    restart: always
    environment:
      POSTGRES_USER: ${USERS_POSTGRES_DB_USER}
      POSTGRES_PASSWORD: ${USERS_POSTGRES_DB_PASSWORD}
      POSTGRES_DB: ${USERS_POSTGRES_DB_NAME}
    ports:
      - "${USERS_POSTGRES_DB_EXTERNAL_PORT}:${USERS_POSTGRES_DB_INTERNAL_PORT}"
    volumes:
      - users_postgres_data:/var/lib/postgresql/data
    networks:
      - woahai_dev_net

  # ===========================
  # Threads Postgres DB
  # ===========================
  threads-postgres-db:
    image: postgres:16
    container_name: ${THREADS_POSTGRES_DB_NAME}
    restart: always
    environment:
      POSTGRES_USER: ${THREADS_POSTGRES_DB_USER}
      POSTGRES_PASSWORD: ${THREADS_POSTGRES_DB_PASSWORD}
      POSTGRES_DB: ${THREADS_POSTGRES_DB_NAME}
    ports:
      - "${THREADS_POSTGRES_DB_EXTERNAL_PORT}:${THREADS_POSTGRES_DB_INTERNAL_PORT}"
    volumes:
      - threads_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${THREADS_POSTGRES_DB_USER} -d ${THREADS_POSTGRES_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - woahai_dev_net

  pgadmin-gui:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_gui
    restart: always
    depends_on:
      - users_postgres_db
      - threads_postgres_db
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    networks:
    - woahai_dev_net

  auth-redis-store:
    image: redis:7
    container_name: ${AUTH_SESSION_REDIS_HOST}
    ports:
      - "${AUTH_SESSION_STORE_PORT}:${AUTH_SESSION_STORE_PORT}"
    command: >
      redis-server --requirepass "${AUTH_SESSION_STORE_PASSWORD}" --port ${AUTH_SESSION_STORE_PORT}
    restart: always
    networks:
      - woahai_dev_net
    volumes:
      - auth_redis_data:/data

  memory-redis-store:
    image: redis:7
    container_name: ${AGENT_MEMORY_REDIS_HOST}
    ports:
      - "${AGENT_MEMORY_REDIS_PORT}:${AGENT_MEMORY_REDIS_PORT}"
    command: >
      redis-server --requirepass "${AGENT_MEMORY_REDIS_PASSWORD}" --port ${AGENT_MEMORY_REDIS_PORT}
    restart: always
    networks:
      - woahai_dev_net
    volumes:
      - memory_redis_data:/data

  threads-redis-store:
    image: redis:7
    container_name: ${THREADS_HISTORY_REDIS_HOST}
    ports:
      - "${THREADS_HISTORY_REDIS_PORT}:${THREADS_HISTORY_REDIS_PORT}"
    command: >
      redis-server --requirepass "${THREADS_REDIS_STORE_PASSWORD}" --port ${THREADS_HISTORY_REDIS_PORT}
    restart: always
    networks:
      - woahai_dev_net
    volumes:
      - threads_redis_data:/data

volumes:
  users_postgres_data:
  threads_postgres_data:
  pgdata:

  memory_redis_data:
  threads_redis_data:
  auth_redis_data:
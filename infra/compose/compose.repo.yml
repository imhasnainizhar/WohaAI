services:
  # ===========================
  # Users Postgres DB
  # ===========================
  users-postgres-db:
    image: postgres:16
    container_name: ${USERS_POSTGRES_DB_NAME}
    restart: always
    environment:
      POSTGRES_USER: ${USERS_POSTGRES_DB_USER}
      POSTGRES_PASSWORD: ${USERS_POSTGRES_DB_PASSWORD}
      POSTGRES_DB: ${USERS_POSTGRES_DB_NAME}
    ports:
      - "${USERS_POSTGRES_DB_PORT}:5432"
    volumes:
      - users_postgres_data:/var/lib/postgresql/data
    networks:
      - WohaAI_dev_net
    profiles:
      - "repo"

  # ===========================
  # Threads Postgres DB
  # ===========================
  threads-postgres-db:
    image: postgres:16
    container_name: ${THREADS_POSTGRES_DB_NAME}
    restart: always
    environment:
      POSTGRES_USER: ${THREADS_POSTGRES_DB_USER}
      POSTGRES_PASSWORD: ${THREADS_POSTGRES_DB_PASSWORD}
      POSTGRES_DB: ${THREADS_POSTGRES_DB_NAME}
    ports:
      - "${THREADS_POSTGRES_DB_PORT}:5432"
    volumes:
      - threads_postgres_data:/var/lib/postgresql/datagINTER
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${THREADS_POSTGRES_DB_USER} -d ${THREADS_POSTGRES_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - WohaAI_dev_net
    profiles:
      - "repo"

  auth-redis-store:
    image: redis:7
    container_name: ${AUTH_SESSION_REDIS_HOST}
    ports:
      - "${AUTH_SESSION_STORE_PORT}:6379"
    command: >
      redis-server --requirepass "${AUTH_SESSION_STORE_PASSWORD}"
    restart: always
    networks:
      - WohaAI_dev_net
    volumes:
      - auth_redis_data:/data
    profiles:
      - "repo"

  memory-redis-store:
    image: redis:7
    container_name: ${AGENT_MEMORY_REDIS_HOST}
    ports:
      - "${AGENT_MEMORY_REDIS_PORT}:6379"
    command: >
      redis-server --requirepass "${AGENT_MEMORY_REDIS_PASSWORD}"
    restart: always
    networks:
      - WohaAI_dev_net
    volumes:
      - memory_redis_data:/data
    profiles:
      - "repo"

  threads-redis-store:
    image: redis:7
    container_name: ${THREADS_HISTORY_REDIS_HOST}
    ports:
      - "${THREADS_HISTORY_REDIS_PORT}:6379"
    command: >
      redis-server --requirepass "${THREADS_HISTORY_REDIS_PASSWORD}"
    restart: always
    networks:
      - WohaAI_dev_net
    volumes:
      - threads_redis_data:/data
    profiles:
      - "repo"


volumes:
  users_postgres_data:
  threads_postgres_data:
  pgdata:

  memory_redis_data:
  threads_redis_data:
  auth_redis_data:
  
networks:
  WohaAI_dev_net:
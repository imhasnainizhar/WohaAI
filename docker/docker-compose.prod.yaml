version: "3.9"

###############################################
# 🐳 Multi-Service Docker Compose (PRODUCTION)
# ---------------------------------------------
# Uses prebuilt images or build:production targets.
# No live mounting, no unnecessary ports.
###############################################

services:
  frontend_app:
    build:
      context: ../src/frontend
      dockerfile: Dockerfile
      target: production
    container_name: frontend_app_prod
    ports:
      - "80:3000"
    environment:
      - NODE_ENV=production
      - APP_PUBLIC_GATEWAY_BASE_URL_01=${APP_PUBLIC_GATEWAY_BASE_URL_01}
    networks:
      - microservices_net_01

  api_gateway:
    build:
      context: ../src/microservices/api_gateway/service
      dockerfile: Dockerfile
      target: production
    container_name: api_gateway_prod
    ports:
      - "${API_GATEWAY}:${API_GATEWAY}"
    environment:
      - NODE_ENV=production
    networks:
      - microservices_net_01

  signin_service:
    build:
      context: ../src/microservices/signin_service/service
      dockerfile: Dockerfile
      target: production
    container_name: signin_service_prod
    ports:
      - "${SIGNIN_SERVICE_PORT}:${SIGNIN_SERVICE_PORT}"
    environment:
      - NODE_ENV=production
      - DATABASE_PROVIDER=${DATABASE_PROVIDER}
      - PRISMA_DATABASE_URL=${PRISMA_DATABASE_URL}
    networks:
      - microservices_net_01

  redis_code_c:
    image: redis:7-alpine
    container_name: redis_prod
    ports:
      - "${REDIS_SERVER_PORT_01}:${REDIS_SERVER_PORT_01}"
    command: >
      redis-server --requirepass "${REDIS_PASSWORD_CODE_C}" --port ${REDIS_SERVER_PORT_01}
    restart: always
    networks:
      - microservices_net_01

networks:
  microservices_net_01:
    driver: bridge

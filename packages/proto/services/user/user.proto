syntax = "proto3";

package user;

service UserService {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
}

message CreateUserRequest {
  string username = 1;
  string email = 2;
  string hashed_password = 3;
  string auth_token = 4;
}

message CreateUserResponse {
  string user_id = 1;
  string username = 2;
  string email = 3;
}

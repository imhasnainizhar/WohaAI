# =============================================
# Nginx Dev Proxy Configuration
# =============================================

# These headers belong in http/server scope, so this is fine
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

server {
    listen 8000;

    location /api/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type' always;
            # Return 204 (No Content) for the preflight
            return 204;
        }

        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # Auth API
    location /api/auth/ {
        proxy_pass http://auth-service:8001/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_pass_header Access-Control-Allow-Origin;
        proxy_pass_header Access-Control-Allow-Credentials;
        proxy_pass_header Access-Control-Allow-Methods;
        proxy_pass_header Access-Control-Allow-Headers;
    }

    # Auth Mailer API
    # location /api/auth-mailer/ {
    #     proxy_pass http://auth-mailer-service:8003/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Connection "";
    # }

    # # User API
    # location /api/user/ {
    #     proxy_pass http://user-service:8002/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Connection "";
    # }
}
# =============================================
# Nginx Dev Proxy Configuration
# =============================================

# These headers belong in http/server scope, so this is fine
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

server {
    listen 8000;

    # Auth API
    location /api/auth/ {
        proxy_pass http://auth-service:8001/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Auth Mailer API
    # location /api/auth-mailer/ {
    #     proxy_pass http://auth-mailer-service:8003/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Connection "";
    # }

    # # User API
    # location /api/user/ {
    #     proxy_pass http://user-service:8002/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Connection "";
    # }
}
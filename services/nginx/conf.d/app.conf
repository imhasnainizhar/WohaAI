# =============================================
# Nginx Dev Proxy Configuration
# =============================================
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Enable proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Frontend (Next.js) proxy
    server {
        listen 8000;  # WOAH_NGINX_PROXY_PORT

        # Serve frontend
        location / {
            proxy_pass http://frontend-app:3000;  # FRONTEND_CONTAINER_NAME:FRONTEND_APP_PORT
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_cache_bypass $http_upgrade;
        }

        # Auth API
        location /api/auth/ {
            proxy_pass http://auth-service:8001/;  # AUTH_SERVICE_CONTAINER_NAME:AUTH_SERVICE_PORT
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Auth Mailer API
        location /api/auth-mailer/ {
            proxy_pass http://auth-mailer-service:8003/;  # AUTH_MAILER_SERVICE_CONTAINER_NAME:AUTH_MAILER_SERVICE_PORT
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # User API
        location /api/user/ {
            proxy_pass http://user-service:8002/;  # USER_SERVICE_CONTAINER_NAME:USER_SERVICE_PORT
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}

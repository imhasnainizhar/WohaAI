server {
    listen 80;
    server_name _;

    # Root location
    location / {
        return 200 'NGINX is running';
        add_header Content-Type text/plain;
    }

    # Reverse proxies
    location /api/user/ {
        proxy_pass http://user_service:8009/;
        include /etc/nginx/proxy_params;
    }

    location /api/auth/ {
        proxy_pass http://auth_service:8010/;
        include /etc/nginx/proxy_params;
    }

    location /api/auth-mailer/ {
        proxy_pass http://auth_mailer_service:8006/;
        include /etc/nginx/proxy_params;
    }

    location /api/code-verification/ {
        proxy_pass http://user_code_verification_service:8004/;
        include /etc/nginx/proxy_params;
    }

    location /api/captcha-verification/ {
        proxy_pass http://captcha_verification_service:8005/;
        include /etc/nginx/proxy_params;
    }
}

services:
  api_gateway:
    build:
      context: ../src/ms/api_gateway/service
      dockerfile: Dockerfile
      target: ${NODE_ENV}
    container_name: api_gateway
    ports:
      - "${API_GATEWAY_PORT}:${API_GATEWAY_PORT}"
    volumes:
      - ../src/ms/api_gateway/service:/app
      - ../src/ms/api_gateway/service/routes.json:/app/routes.json
    restart: always
    environment:
      - NODE_ENV=${NODE_ENV}
      - API_GATEWAY_PORT=${API_GATEWAY_PORT}
      - USER_SERVICE_PORT=${USER_SERVICE_PORT}
      - SIGNIN_SERVICE_PORT=${SIGNIN_SERVICE_PORT}
      - SIGNUP_SERVICE_PORT=${SIGNUP_SERVICE_PORT}
      - USER_CODE_VERIFICATION_PORT=${USER_CODE_VERIFICATION_PORT}
      - CODE_MAILER_PORT=${CODE_MAILER_PORT}
      - CAPTCHA_VERIFICATION_PORT=${CAPTCHA_VERIFICATION_PORT}
      - SIGNUP_VALIDATOR_PORT=${SIGNUP_VALIDATOR_PORT}

networks:
  default:
    name: microservices_net_01
    external: true

###############################################
# 🐳 Multi-Service Docker Compose
###############################################

services:
  ##########################################################
  # 🌐 FRONTEND SERVICE (Next.js)
  ##########################################################
  frontend_app:    
    build:
      context: ../src/frontend
      dockerfile: Dockerfile
      target: ${NODE_ENV}
    container_name: frontend_app
    expose:
      - ${FRONTEND_APP_PORT}
    ports:
      - "${FRONTEND_APP_PORT}:${FRONTEND_APP_PORT}"
    volumes:
      - ../src/frontend/src:/app/src
    restart: always
    environment:
      - NODE_ENV=${NODE_ENV}
      - APP_PUBLIC_RECAPTCHA_SITE_KEY=${APP_PUBLIC_RECAPTCHA_SITE_KEY}
      - APP_PUBLIC_GATEWAY_BASE_URL_01=${APP_PUBLIC_GATEWAY_BASE_URL_01}
      - CHOKIDAR_USEPOLLING=true

  ##########################################################
  # 🚏 API GATEWAY SERVICE
  ##########################################################
  api_gateway:
    build:
      context: ../src/microservices/api_gateway_service/service
      dockerfile: Dockerfile
      target: ${NODE_ENV}
    container_name: api_gateway
    expose:
      - "${API_GATEWAY_PORT}"
    ports:
      - "${API_GATEWAY_PORT}:${API_GATEWAY_PORT}"
    volumes:
      - ../src/microservices/api_gateway/service:/app
      - ./node_modules:/app/node_modules
    environment:
      - NODE_ENV=${NODE_ENV}
      - API_GATEWAY_PORT=${API_GATEWAY_PORT}
      - USER_SERVICE_PORT=${USER_SERVICE_PORT}
      - SIGNIN_SERVICE_PORT=${SIGNIN_SERVICE_PORT}
      - SIGNUP_SERVICE_PORT=${SIGNUP_SERVICE_PORT}
      - USER_VERIFY_CODE_PORT=${USER_VERIFY_CODE_PORT}
      - CODE_MAILER_PORT=${CODE_MAILER_PORT}
      - CAPTCHA_PORT=${CAPTCHA_PORT}
      - SIGNUP_VALIDATOR_PORT=${SIGNUP_VALIDATOR_PORT}
    networks:
      - microservices_net_01

  ##########################################################
  # 🔐 SIGNIN SERVICE
  ##########################################################
  signin_service:    
    build:
      context: ../src/microservices/signin_service/service
      dockerfile: Dockerfile
      target: ${NODE_ENV}
    container_name: signin_service
    expose:
      - "${SIGNIN_SERVICE_PORT}"
    ports:
      - "${SIGNIN_SERVICE_PORT}:${SIGNIN_SERVICE_PORT}"
    volumes:
      - ../src/microservices/signin_service/service:/src
      - ../src/microservices/node_modules:/src/node_modules
    restart: always
    environment:
      - NODE_ENV=${NODE_ENV}
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_PROVIDER=${DATABASE_PROVIDER}
      - PRISMA_DATABASE_URL=${PRISMA_DATABASE_URL}
      - SIGNIN_SERVICE_PORT=${SIGNIN_SERVICE_PORT}
    networks:
      - microservices_net_01

  ##########################################################
  # 🚪 SIGNOUT SERVICE
  ##########################################################
  signout_service:   
    build:
      context: ../src/microservices/signout_service/service
      dockerfile: Dockerfile
      target: ${NODE_ENV}
    container_name: signout_service
    expose:
      - "${SIGNOUT_SERVICE_PORT}"
    ports:
      - "${SIGNOUT_SERVICE_PORT}:${SIGNOUT_SERVICE_PORT}"
    volumes:
      - ../src/microservices/signout_service/service:/src
      - ../src/microservices/node_modules:/src/node_modules
    restart: always
    environment:
      - NODE_ENV=${NODE_ENV}
      - SIGNOUT_SERVICE_PORT=${SIGNOUT_SERVICE_PORT}
    networks:
      - microservices_net_01

  ##########################################################
  # 🧾 VERIFY USER SERVICE
  ##########################################################
  user_verify_code_service:    
    build:
      context: ../src/microservices/user_verify_code_service/service
      dockerfile: Dockerfile
      target: ${NODE_ENV}
    container_name: user_verify_code_service
    expose:
      - "${USER_VERIFY_CODE_PORT}"
    ports:
      - "${USER_VERIFY_CODE_PORT}:${USER_VERIFY_CODE_PORT}"
    volumes:
      - ../src/microservices/user_verify_code_service/service:/src
      - ../src/microservices/node_modules:/src/node_modules
    restart: always
    environment:
      - NODE_ENV=${NODE_ENV}
      - REDIS_CODE_C=${REDIS_CODE_C}
      - REDIS_PASSWORD_CODE_C=${REDIS_PASSWORD_CODE_C}
      - USER_VERIFY_CODE_PORT=${USER_VERIFY_CODE_PORT}
    depends_on:
      - redis_code_c
    networks:
      - microservices_net_01

  ##########################################################
  # 🤖 VERIFY CAPTCHA SERVICE
  ##########################################################
  captcha_service:    
    build:
      context: ../src/microservices/captcha_service/service
      dockerfile: Dockerfile
      target: ${NODE_ENV}
    container_name: captcha_service
    expose:
      - "${CAPTCHA_PORT}"
    ports:
      - "${CAPTCHA_PORT}:${CAPTCHA_PORT}"
    volumes:
      - ../src/microservices/captcha_service/service:/src
      - ../src/microservices/node_modules:/src/node_modules
    restart: always
    environment:
      - NODE_ENV=${NODE_ENV}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY}
      - CAPTCHA_PORT=${CAPTCHA_PORT}
    networks:
      - microservices_net_01

  ##########################################################
  # 📧 CODE MAILER SERVICE
  ##########################################################
  code_mailer_service:  
    build:
      context: ../src/microservices/code_mailer_service/service
      dockerfile: Dockerfile
      target: ${NODE_ENV}
    container_name: code_mailer_service
    expose:
      - "${CODE_MAILER_PORT}"
    ports:
      - "${CODE_MAILER_PORT}:${CODE_MAILER_PORT}"
    volumes:
      - ../src/microservices/code_mailer_service/service:/src
      - ../src/microservices/node_modules:/src/node_modules
    restart: always
    environment:
      - NODE_ENV=${NODE_ENV}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - EMAIL_FROM=${EMAIL_FROM}
      - REDIS_CODE_C=${REDIS_CODE_C}
      - REDIS_PASSWORD_CODE_C=${REDIS_PASSWORD_CODE_C}
      - CODE_MAILER_PORT=${CODE_MAILER_PORT}
    depends_on:
      - redis_code_c
    networks:
      - microservices_net_01

  ##########################################################
  # 🧠 SIGNUP VALIDATOR SERVICE
  ##########################################################
  signup_validator_service:  
    build:
      context: ../src/microservices/signup_validator_service/service
      dockerfile: Dockerfile
      target: ${NODE_ENV}
    container_name: signup_validator_service
    expose:
      - "${SIGNUP_VALIDATOR_PORT}"
    ports:
      - "${SIGNUP_VALIDATOR_PORT}:${SIGNUP_VALIDATOR_PORT}"
    volumes:
      - ../src/microservices/signup_validator_service/service:/src
      - ../src/microservices/node_modules:/src/node_modules
    restart: always
    environment:
      - NODE_ENV=${NODE_ENV}
      - DATABASE_PROVIDER=${DATABASE_PROVIDER}
      - PRISMA_DATABASE_URL=${PRISMA_DATABASE_URL}
      - SIGNUP_VALIDATOR_PORT=${SIGNUP_VALIDATOR_PORT}
    networks:
      - microservices_net_01

  ##########################################################
  # 🧍 USER SERVICE
  ##########################################################
  user_service:   
    build:
      context: ../src/microservices/user_service/service
      dockerfile: Dockerfile
      target: ${NODE_ENV}
    container_name: user_service
    expose:
      - "${USER_SERVICE_PORT}"
    ports:
      - "${USER_SERVICE_PORT}:${USER_SERVICE_PORT}"
    volumes:
      - ../src/microservices/user_service/service:/src
      - ../src/microservices/node_modules:/src/node_modules
    restart: always
    environment:
      - NODE_ENV=${NODE_ENV}
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_PROVIDER=${DATABASE_PROVIDER}
      - PRISMA_DATABASE_URL=${PRISMA_DATABASE_URL}
      - USER_SERVICE_PORT=${USER_SERVICE_PORT}
    networks:
      - microservices_net_01

  ##########################################################
  # 📝 SIGNUP SERVICE
  ##########################################################
  signup_service:    
    build:
      context: ../src/microservices/signup_service/service
      dockerfile: Dockerfile
      target: ${NODE_ENV}
    container_name: signup_service
    expose:
      - "${SIGNUP_SERVICE_PORT}"
    ports:
      - "${SIGNUP_SERVICE_PORT}:${SIGNUP_SERVICE_PORT}"
    volumes:
      - ../src/microservices/signup_service/service:/src
      - ../src/microservices/node_modules:/src/node_modules
    restart: always
    environment:
      - NODE_ENV=${NODE_ENV}
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_PROVIDER=${DATABASE_PROVIDER}
      - PRISMA_DATABASE_URL=${PRISMA_DATABASE_URL}
      - SIGNUP_SERVICE_PORT=${SIGNUP_SERVICE_PORT}
    networks:
      - microservices_net_01

  ##########################################################
  # ⚡ REDIS DATABASE
  ##########################################################
  redis_code_c:    
    image: redis:7
    container_name: verification_code_cache
    expose:
      - "${REDIS_SERVER_PORT_01}"
    ports:
      - "${REDIS_SERVER_PORT_01}:${REDIS_SERVER_PORT_01}"
    command: >
      redis-server --requirepass "${REDIS_PASSWORD_CODE_C}" --port ${REDIS_SERVER_PORT_01}
    restart: always
    networks:
      - microservices_net_01

##########################################################
# 🗃️ Shared Volumes and Networks
##########################################################
volumes:
  pgdata:

networks:
  microservices_net_01:
    driver: bridge

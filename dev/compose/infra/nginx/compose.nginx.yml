
services:
  nginx-proxy:
    image: nginx:latest
    container_name: ${NGINX_PROXY_CONTAINER_NAME}
    ports:
      - "${NGINX_PROXY_PORT}:${NGINX_PROXY_PORT}"
    volumes:
      - ../../../../services/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../../../services/nginx/conf.d:/etc/nginx/conf.d:ro
      - ../../../../services/nginx/proxy_params:/etc/nginx/proxy_params:ro
    networks:
      - microservices_net_01
networks:
  microservices_net_01:
    external: true
services:
  auth-service:
    build:
      context: ../../../src/ms/auth_service/
      dockerfile: Dockerfile
      target: ${NODE_ENV}
    container_name: auth-service
    ports:
      - "${AUTH_SERVICE_PORT}:${AUTH_SERVICE_PORT}"
    volumes:
      - ../../../src/ms/auth_service/src:/app/src
    restart: always
    env_file:
      - ../../../.env
      - ../../../.env.docker
    # environment:
    #   - NODE_ENV=${NODE_ENV}

    #   - JWT_ACCESS_SECRET_KEY=${JWT_ACCESS_SECRET_KEY}
    #   - JWT_REFRESH_SECRET_KEY=${JWT_REFRESH_SECRET_KEY}
    #   - JWT_PRIVATE_ACCESS_SECRET_KEY=${JWT_PRIVATE_ACCESS_SECRET_KEY}

    #   - REFRESH_TOKEN_NAME=${REFRESH_TOKEN_NAME}
    #   - ACCESS_TOKEN_NAME=${ACCESS_TOKEN_NAME}
    #   - PRIVATE_ACCESS_TOKEN_NAME=${PRIVATE_ACCESS_TOKEN_NAME}

    #   - POSTGRES_PROVIDER=${POSTGRES_PROVIDER}
    #   - PRISMA_USER_DATABASE_URI=${PRISMA_USER_DATABASE_URI}
    #   - AUTH_SERVICE_PORT:${AUTH_SERVICE_PORT}
    networks:
      - microservices_net_01

  user-service:
    build:
      context: ../../../src/ms/user_service/
      dockerfile: Dockerfile
      target: ${NODE_ENV}
    container_name: user-service
    ports:
      - "${USER_SERVICE_PORT}:${USER_SERVICE_PORT}"
    volumes:
      - ../../../src/ms/user_service/src:/app/src
    restart: always
    env_file:
      - ../../../.env
      - ../../../.env.docker
    networks:
      - microservices_net_01

networks:
  microservices_net_01:
    external: true

services:
  auth_redis_store:
    image: redis:7
    container_name: auth_redis_store
    ports:
      - "${AUTH_REDIS_STORE_PORT}:${AUTH_REDIS_STORE_PORT}"
    command: >
      redis-server --requirepass "${AUTH_REDIS_STORE_PASSWORD}" --port ${AUTH_REDIS_STORE_PORT}
    restart: always
    networks:
      - microservices_net
      - woahai_data_net

  memory_redis_store:
    image: redis:7
    container_name: memory_redis_store
    ports:
      - "${MEMORY_REDIS_STORE_PORT}:${MEMORY_REDIS_STORE_PORT}"
    command: >
      redis-server --requirepass "${MEMORY_REDIS_STORE_PASSWORD}" --port ${MEMORY_REDIS_STORE_PORT}
    restart: always
    networks:
      - microservices_net
      - woahai_data_net

  threads_redis_store:
    image: redis:7
    container_name: threads_redis_store
    ports:
      - "${THREADS_REDIS_STORE_PORT}:${THREADS_REDIS_STORE_PORT}"
    command: >
      redis-server --requirepass "${THREADS_REDIS_STORE_PASSWORD}" --port ${THREADS_REDIS_STORE_PORT}
    restart: always
    networks:
      - microservices_net
      - woahai_data_net

networks:
  microservices_net:
    external: true
    
  woahai_data_net:
    external: true

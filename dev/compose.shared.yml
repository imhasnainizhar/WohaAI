services:
  zookeeper:
    image: wurstmeister/zookeeper:latest
    container_name: kafka_clusters_0_zookeeper
    ports:
      - "${KAFKA_CLUSTERS_0_ZOOKEEPER_PORT}:${KAFKA_CLUSTERS_0_ZOOKEEPER_PORT}"

  kafka:
    image: wurstmeister/kafka:latest
    container_name: kafka
    ports:
      - "${KAFKA_CLUSTERS_0_PORT}:${KAFKA_CLUSTERS_0_PORT}"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: ${KAFKA_ZOOKEEPER_CONNECT}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP}
      KAFKA_INTER_BROKER_LISTENER_NAME: ${KAFKA_INTER_BROKER_LISTENER_NAME}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR}
    depends_on:
      - zookeeper

  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ${KAFKA_CLUSTERS_0_NAME}
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS}
      KAFKA_CLUSTERS_0_ZOOKEEPER: ${KAFKA_CLUSTERS_0_ZOOKEEPER}
    depends_on:
      - kafka

  redis_code_c:
    image: redis:7
    container_name: verification_code_cache
    ports:
      - "${REDIS_CODE_C_PORT}:${REDIS_CODE_C_PORT}"
    command: >
      redis-server --requirepass "${REDIS_PASSWORD_CODE_C}" --port ${REDIS_CODE_C_PORT}
    restart: always
    networks:
      - microservices_net_01

networks:
  microservices_net_01:
    name: microservices_net_01
    driver: bridge
